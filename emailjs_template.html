<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; background: #f4f4f4; padding: 20px;">

  <!-- Header -->
  <div style="background: #1a685b; padding: 24px; text-align: center; border-radius: 8px 8px 0 0;">
    <a href="http://localhost/KissanSure/user/index.php" target="_blank">
      <img src="YOUR_LOGO_URL_HERE" alt="KissanSure" style="height: 60px;">
    </a>
    <h2 style="color: #FFAC00; margin: 10px 0 0 0; font-size: 22px;">New Contact Message</h2>
  </div>

  <!-- Body -->
  <div style="background: #ffffff; padding: 30px; border-radius: 0 0 8px 8px;">
    <p style="color: #555; font-size: 14px; margin-top: 0;">You have received a new message via the KissanSure contact form.</p>

    <table style="width: 100%; border-collapse: collapse;">
      <tr>
        <td style="padding: 10px; background: #f9f9f9; border-left: 4px solid #1a685b; font-weight: bold; color: #1a685b; width: 30%;">Name</td>
        <td style="padding: 10px; background: #f9f9f9; color: #333;">{{from_name}}</td>
      </tr>
      <tr>
        <td style="padding: 10px; font-weight: bold; color: #1a685b; border-left: 4px solid #1a685b;">Email</td>
        <td style="padding: 10px; color: #333;">{{from_email}}</td>
      </tr>
      <tr>
        <td style="padding: 10px; background: #f9f9f9; font-weight: bold; color: #1a685b; border-left: 4px solid #1a685b;">Phone</td>
        <td style="padding: 10px; background: #f9f9f9; color: #333;">{{phone}}</td>
      </tr>
      <tr>
        <td style="padding: 10px; font-weight: bold; color: #1a685b; vertical-align: top; border-left: 4px solid #1a685b;">Query</td>
        <td style="padding: 10px; color: #333;">{{message}}</td>
      </tr>
    </table>

    <p style="margin-top: 24px; font-size: 13px; color: #999; text-align: center; border-top: 1px solid #eee; padding-top: 16px;">
      &copy; 2026 KissanSure. All rights reserved.
    </p>
  </div>

</div>
